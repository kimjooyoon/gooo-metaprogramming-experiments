name: 100-case codegen matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kimjooyoon/gooo-metaprogramming-lab
          ref: e5954340edbe9611508a69c20ed627a424aa11ca
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 3086deb0892329fe10a38f2ee2882a5375be2fa6
          path: gooo
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build Gooo and matrix runner
        run: |
          (cd gooo && go build -o "$RUNNER_TEMP/gooo" ./cmd/gooo)
          (cd lab && go build -o "$RUNNER_TEMP/gooo-lab" ./cmd/lab)
      - name: Compile and replay all 100 candidates
        env:
          GOOO_BIN: ${{ runner.temp }}/gooo
          GOOO_LAYA_URL: ''
        run: |
          "$RUNNER_TEMP/gooo-lab" matrix --plan plan-v1.json --out "$RUNNER_TEMP/matrix"
          jq -e '.experiment_count == 100 and .top1_mean_completeness == 1 and ([.candidates[] | select(.compiled)] | length) == 100 and ([.candidates[] | select(.deterministic)] | length) == 100' "$RUNNER_TEMP/matrix/matrix-report.json"
      - name: Generate, compile, and execute 100 Gooo body-codegen cases
        env:
          GOOO_LAYA_URL: ''
        run: |
          export GOOO_SOURCE_SHA="$(git -C gooo rev-parse HEAD)"
          python3 scripts/direct_body_codegen_cohort.py \
            --gooo-bin "$RUNNER_TEMP/gooo" \
            --plan cohorts/body-codegen-100/plan-v1.json \
            --out "$RUNNER_TEMP/body-codegen-100"
          jq -e --arg source "$GOOO_SOURCE_SHA" '
            def dimension($id): [.completeness_receipt.dimensions[] | select(.id == $id)][0];
            .decision == "PASS" and
            .case_count == 100 and
            .checked_output_count == 2900 and
            .behavioral_matches == 2900 and
            .behavioral_completeness_percent == 100 and
            .body_ast_completeness_percent == 100 and
            .eligible_multi_route_cases == 50 and
            .generated_package_test_passed and
            .all_typechecks_passed and
            .all_internal_replays_passed and
            .route_semantic_equivalence_passes == 100 and
            .compiler_receipt_valid_case_count == 100 and
            .compiler_core_receipt_passes == 100 and
            ([.cases[] | select(
              .compiler_source_sha == $source and
              .compiler_completeness_receipt.schema == "gooo/metaprogramming-completeness-receipt/v2" and
              .compiler_completeness_receipt.scope.compiler_source_sha == $source and
              .compiler_completeness_receipt.scope.plan_sha256 == .compiler_plan_sha256 and
              .compiler_completeness_receipt.aggregate_completeness_score == null
            )] | length) == 100 and
            .int64_extreme_expected_outputs == 400 and
            .int64_extreme_checked_outputs == 400 and
            .int64_extreme_behavioral_matches == 400 and
            .int64_partition_proven_cases == 100 and
            .int64_partition_expected_observations == (100 * (.int64_partition_proof.representative_inputs | length)) and
            .int64_partition_observed_matches == .int64_partition_expected_observations and
            .int64_partition_proof.schema == "gooo/int64-affine-partition/v2" and
            .int64_partition_proof.profile_supported and
            .int64_partition_proof.partition_covers_int64 and
            .int64_partition_proof.arithmetic_semantics == "signed_int64_modulo_2^64" and
            .int64_partition_proof.max_abs_input_coefficient == 8 and
            .int64_partition_proof.supported_affine_operators == ["+", "-", "*"] and
            .int64_partition_proof.transition_points_are_conservative_cuts and
            .int64_partition_proof.execution_contains_all_representatives and
            .int64_partition_proof.compiled_execution_matches_representatives and
            .int64_partition_proof.proved_case_count == 100 and
            .int64_partition_proof.comparison_count == 12 and
            .int64_partition_proof.condition_count == 10 and
            .int64_partition_proof.result_pair_count == 5 and
            (.int64_partition_proof.body_styles | length) == 2 and
            .int64_partition_proof.partition_cell_count == (.int64_partition_proof.representative_inputs | length) and
            (.int64_partition_proof.transition_points | length) == (.int64_partition_proof.representative_inputs | length) - 1 and
            (.int64_partition_proof.representative_inputs | length) > 8 and
            .external_repeat_mismatches == 0 and
            .repository_writes == 0 and
            (.cases | length) == 100 and
            .children_average_cpu_one_core_percent > 0 and
            .children_average_cpu_host_percent > 0 and
            .children_peak_rss_bytes > 0 and
            .external_laya_process_resources_included == false and
            .completeness_receipt.decision == "PASS_WITHIN_DECLARED_FIXTURE_SCOPE" and
            .completeness_receipt.schema == "gooo/metaprogramming-completeness-receipt/v2" and
            (.completeness_receipt | has("aggregate_completeness_score")) and
            .completeness_receipt.aggregate_completeness_score == null and
            .completeness_receipt.first_unresolved.id == "laya_decision_observation" and
            .completeness_receipt.first_unresolved.status == "UNKNOWN" and
            .completeness_receipt.first_unresolved.next_operation == "RUN_WITH_A_PINNED_LAYA_SERVICE_AND_RETAIN_MODEL_REVISION" and
            dimension("real_use_case_coverage").status == "UNKNOWN" and
            dimension("reverse_observation_coverage").status == "UNKNOWN" and
            dimension("full_domain_semantics").status == "UNKNOWN" and
            dimension("route_semantic_equivalence").status == "PASS" and
            dimension("route_semantic_equivalence").numerator == 100 and
            dimension("route_semantic_equivalence").denominator == 100 and
            dimension("int64_extreme_boundary_behavior").status == "PASS" and
            dimension("int64_extreme_boundary_behavior").numerator == 400 and
            dimension("int64_extreme_boundary_behavior").denominator == 400 and
            dimension("partitioned_int64_semantics").status == "PASS" and
            dimension("partitioned_int64_semantics").numerator == 100 and
            dimension("partitioned_int64_semantics").denominator == 100 and
            dimension("compiler_completeness_receipt_coverage").status == "PASS" and
            dimension("compiler_completeness_receipt_coverage").numerator == 100 and
            dimension("compiler_completeness_receipt_coverage").denominator == 100 and
            dimension("compiler_core_receipt_passes").status == "PASS" and
            dimension("compiler_core_receipt_passes").numerator == 100 and
            dimension("compiler_core_receipt_passes").denominator == 100 and
            dimension("resource_baseline_comparison").status == "UNKNOWN" and
          dimension("route_quality").status == "UNKNOWN" and
          dimension("laya_decision_observation").status == "UNKNOWN"
          ' "$RUNNER_TEMP/body-codegen-100/body-codegen-report.json"
      - name: Generate, compile, and exhaust the Boolean domain for 100 Gooo bodies
        env:
          GOOO_LAYA_URL: ''
        run: |
          export GOOO_SOURCE_SHA="$(git -C gooo rev-parse HEAD)"
          python3 scripts/direct_boolean_body_codegen_cohort.py \
            --gooo-bin "$RUNNER_TEMP/gooo" \
            --plan cohorts/body-codegen-boolean-100/plan-v1.json \
            --out "$RUNNER_TEMP/body-codegen-boolean-100"
          jq -e '
            def dimension($id): [.completeness_receipt.dimensions[] | select(.id == $id)][0];
            .decision == "PASS" and
            .case_count == 100 and
            .condition_count == 5 and
            .result_pair_count == 4 and
            .body_style_count == 5 and
            .checked_output_count == 200 and
            .behavioral_matches == 200 and
            .full_boolean_domain_complete and
            .generated_package_test_passed and
            .all_typechecks_passed and
            .all_internal_replays_passed and
            .route_equivalence_passes == 100 and
            .external_repeat_matches == 100 and
            .external_repeat_mismatches == 0 and
            .repository_writes == 0 and
            (.cases | length) == 100 and
            (.completeness_receipt | has("aggregate_completeness_score")) and
            .completeness_receipt.aggregate_completeness_score == null and
            .completeness_receipt.decision == "PASS_WITHIN_DECLARED_FIXTURE_SCOPE" and
            .completeness_receipt.schema == "gooo/metaprogramming-completeness-receipt/v2" and
            .completeness_receipt.scope.input_type == "Boolean" and
            .completeness_receipt.scope.domain_cardinality == 2 and
            (.completeness_receipt.scope.allowed_investment | length) > 0 and
            (.completeness_receipt.scope.excluded_scope | length) > 0 and
            (.completeness_receipt.status_counts | has("UNKNOWN")) and
            (.completeness_receipt.unresolved_claims | length) > 0 and
            .completeness_receipt.first_unresolved.id == "laya_decision_observation" and
            .completeness_receipt.first_unresolved.status == "UNKNOWN" and
            (.completeness_receipt.first_unresolved.reason | length) > 0 and
            (.completeness_receipt.first_unresolved.next_operation | length) > 0 and
            dimension("exhaustive_boolean_domain").status == "PASS" and
            dimension("exhaustive_boolean_domain").numerator == 200 and
            dimension("exhaustive_boolean_domain").denominator == 200 and
            dimension("route_semantic_equivalence").status == "PASS" and
            dimension("route_semantic_equivalence").numerator == 100 and
            dimension("route_semantic_equivalence").denominator == 100 and
            dimension("use_case_coverage").status == "UNKNOWN" and
            dimension("laya_decision_observation").status == "UNKNOWN"
          ' "$RUNNER_TEMP/body-codegen-boolean-100/boolean-body-codegen-report.json"
      - name: Validate shared completeness receipt contract
        run: |
          python3 scripts/validate_completeness_receipts.py \
            "$RUNNER_TEMP/body-codegen-100/body-codegen-report.json" \
            "$RUNNER_TEMP/body-codegen-boolean-100/boolean-body-codegen-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-body-codegen-cohort-${{ github.sha }}
          path: ${{ runner.temp }}/body-codegen-100/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boolean-body-codegen-cohort-${{ github.sha }}
          path: ${{ runner.temp }}/body-codegen-boolean-100/
          if-no-files-found: error

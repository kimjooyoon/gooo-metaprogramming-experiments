name: 100-case codegen matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kimjooyoon/gooo-metaprogramming-lab
          ref: e5954340edbe9611508a69c20ed627a424aa11ca
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: aabbbc11aae2b0046522cd2922038be1768f4154
          path: gooo
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build Gooo and matrix runner
        run: |
          (cd gooo && go build -o "$RUNNER_TEMP/gooo" ./cmd/gooo)
          (cd lab && go build -o "$RUNNER_TEMP/gooo-lab" ./cmd/lab)
      - name: Compile and replay all 100 candidates
        env:
          GOOO_BIN: ${{ runner.temp }}/gooo
          GOOO_LAYA_URL: ''
        run: |
          "$RUNNER_TEMP/gooo-lab" matrix --plan plan-v1.json --out "$RUNNER_TEMP/matrix"
          jq -e '.experiment_count == 100 and .top1_mean_completeness == 1 and ([.candidates[] | select(.compiled)] | length) == 100 and ([.candidates[] | select(.deterministic)] | length) == 100' "$RUNNER_TEMP/matrix/matrix-report.json"
      - name: Generate, compile, and execute 100 Gooo body-codegen cases
        env:
          GOOO_LAYA_URL: ''
        run: |
          export GOOO_SOURCE_SHA="$(git -C gooo rev-parse HEAD)"
          python3 scripts/direct_body_codegen_cohort.py \
            --gooo-bin "$RUNNER_TEMP/gooo" \
            --plan cohorts/body-codegen-100/plan-v1.json \
            --out "$RUNNER_TEMP/body-codegen-100"
          jq -e '
            def dimension($id): [.completeness_receipt.dimensions[] | select(.id == $id)][0];
            .decision == "PASS" and
            .case_count == 100 and
            .checked_output_count == 2500 and
            .behavioral_matches == 2500 and
            .behavioral_completeness_percent == 100 and
            .body_ast_completeness_percent == 100 and
            .eligible_multi_route_cases == 50 and
            .generated_package_test_passed and
            .all_typechecks_passed and
            .all_internal_replays_passed and
            .route_semantic_equivalence_passes == 100 and
            .external_repeat_mismatches == 0 and
            .repository_writes == 0 and
            (.cases | length) == 100 and
            .children_average_cpu_one_core_percent > 0 and
            .children_average_cpu_host_percent > 0 and
            .children_peak_rss_bytes > 0 and
            .external_laya_process_resources_included == false and
            .completeness_receipt.decision == "PASS_WITHIN_DECLARED_FIXTURE_SCOPE" and
            (.completeness_receipt | has("aggregate_completeness_score")) and
            .completeness_receipt.aggregate_completeness_score == null and
            .completeness_receipt.first_unresolved.id == "laya_decision_observation" and
            .completeness_receipt.first_unresolved.status == "UNKNOWN" and
            .completeness_receipt.first_unresolved.next_operation == "RUN_WITH_A_PINNED_LAYA_SERVICE_AND_RETAIN_MODEL_REVISION" and
            dimension("real_use_case_coverage").status == "UNKNOWN" and
            dimension("reverse_observation_coverage").status == "UNKNOWN" and
            dimension("full_domain_semantics").status == "UNKNOWN" and
            dimension("route_semantic_equivalence").status == "PASS" and
            dimension("route_semantic_equivalence").numerator == 100 and
            dimension("route_semantic_equivalence").denominator == 100 and
            dimension("resource_baseline_comparison").status == "UNKNOWN" and
            dimension("route_quality").status == "UNKNOWN" and
            dimension("laya_decision_observation").status == "UNKNOWN"
          ' "$RUNNER_TEMP/body-codegen-100/body-codegen-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-body-codegen-cohort-${{ github.sha }}
          path: ${{ runner.temp }}/body-codegen-100/
          if-no-files-found: error

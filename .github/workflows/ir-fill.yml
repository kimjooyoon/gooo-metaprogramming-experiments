name: IR body-fill evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  body-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: ec4bf3e5f4119118b501c1b45862936eb46b95b7
          path: compiler
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Validate published evidence
        run: python3 scripts/validate_ir_fill_evidence.py
      - name: Build the pinned compiler
        working-directory: compiler
        run: go build -o "$RUNNER_TEMP/gooo-ir-fill" ./cmd/gooo
      - name: Replay original and revised plans with compiled Go oracles
        env:
          GOOO_LAYA_URL: ''
        run: |
          python3 cohorts/ir-fill-2026-09-30/composition/run_corpus.py \
            --binary "$RUNNER_TEMP/gooo-ir-fill" \
            --source-repo "$GITHUB_WORKSPACE/compiler" \
            --expected-revision ec4bf3e5f4119118b501c1b45862936eb46b95b7 \
            --output "$RUNNER_TEMP/ir-fill-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ir-fill-replay-${{ github.sha }}
          path: ${{ runner.temp }}/ir-fill-replay
          if-no-files-found: warn

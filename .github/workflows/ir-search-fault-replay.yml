name: IR-search MOCK fault evidence replay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mock-fault-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOO_LAYA_URL: ''
      GOOO_LAYA_API_KEY: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Check validator regressions
        run: |
          python3 -m unittest discover \
            -s cohorts/ir-search-faults-2026-09-30/scripts -p 'test_*.py'

      - name: Validate saved MOCK evidence without model or compiler calls
        run: |
          python3 cohorts/ir-search-faults-2026-09-30/scripts/validate_saved.py \
            --run-dir cohorts/ir-search-faults-2026-09-30/runs/final-mock-provider-run-2026-09-30

      - name: Add finite evidence and limitations to summary
        if: always()
        run: |
          cat cohorts/ir-search-faults-2026-09-30/runs/final-mock-provider-run-2026-09-30/report.md >> "$GITHUB_STEP_SUMMARY"

name: IR-search cohort replay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ir-search-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 29d44bc778d85aee03b9af500bd83dc98f368189
          path: compiler
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Build pinned compiler
        working-directory: compiler
        run: go build -o "$RUNNER_TEMP/gooo-ir-search" ./cmd/gooo
      - name: Validate saved cohort and run offline protocol/oracle replays
        env:
          GOOO_LAYA_URL: ''
          GOOO_LAYA_API_KEY: ''
        run: |
          python3 scripts/validate_ir_search_cohort.py \
            --compiler-root "$GITHUB_WORKSPACE/compiler" \
            --binary "$RUNNER_TEMP/gooo-ir-search" \
            --source-sha 29d44bc778d85aee03b9af500bd83dc98f368189 \
            --output "$RUNNER_TEMP/ir-search-validation"
      - name: Add validation summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ir-search-validation/validation-report.md" ]; then
            cat "$RUNNER_TEMP/ir-search-validation/validation-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ir-search-validation-${{ github.sha }}
          path: ${{ runner.temp }}/ir-search-validation
          if-no-files-found: warn
